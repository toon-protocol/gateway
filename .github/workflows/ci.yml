# The gateway's tests and its type check.
#
# This repository had no workflow at all until the deploy bundle landed, and a
# guard on that bundle (deploy/bundle.test.mjs) that nothing runs is not a
# guard.
#
# The guard is its OWN step rather than another glob on `npm test`, though not
# because the two compete: the bundle guard reads files and asserts on bytes,
# so it opens no socket and stands up no listener. (An earlier version of this
# note blamed a thirty-third concurrent test file for making a timing-sensitive
# source test time out occasionally; TOON_Network#109 found the real cause —
# `tests/rotation.test.mjs` firing its first handover before the admission
# round's own relay connection was open, so a busy machine could lose the race
# against a short resolve timeout before a byte was exchanged — and fixed it by
# having the test harness wait for the real thing admission needs, a known
# Provider Profile, rather than by keeping the suite's concurrency down.)
# Keeping the guard apart still costs nothing, and leaves `npm test` behaving
# exactly as it did.
name: ci

on:
  push:
    branches: [main, milestone-5, milestone-7]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` and not `npm install`: the lockfile is the thing under test
      # as much as the source is.
      - run: npm ci
      - run: npm test
      - run: npm run test:deploy
      - run: npm run typecheck
